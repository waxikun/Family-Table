<script>

const TABS=[['home',IC('<path d="M4 11l8-7 8 7v9H4z"/>'),'Home'],['menu',IC('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>'),'Menu'],['vote',IC('<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/>'),'Voting'],['shop',IC('<path d="M4 9h16l-1.5 10h-13z"/><path d="M9 9l3-5 3 5"/>'),'Palengke'],['req',IC('<path d="M6 16v-5a6 6 0 0112 0v5l1.5 2h-15z"/><path d="M10 20.5h4"/>'),'Requests'],['cal',IC('<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'),'Calendar'],['more',IC('<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>'),'More']];
const CATS=['Main Meal','Side Dish','Beverage'];
const MT=['Breakfast','Lunch','Merienda','Dinner'],SLOT_T={Breakfast:'07:00',Lunch:'12:00',Merienda:'15:30',Dinner:'19:00'};
const slot=m=>{if(MT.includes(m.time))return m.time;const h=parseInt(m.time);return isNaN(h)||(h>=10&&h<14)?'Lunch':h<10?'Breakfast':h<17?'Merienda':'Dinner'};
const si=m=>MT.indexOf(slot(m));
const normCat=c=>CATS.includes(c)?c:/bever|drink/i.test(c||'')?'Beverage':/dessert|snack|side/i.test(c||'')?'Side Dish':'Main Meal';
const mealRecipes=m=>m.recipes||(m.recipe?[m.recipe]:[]);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const todayS=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const seed=()=>({profiles:['Gil','Marissa','Caroline','Kyle','Joax','Gulliver'].map(n=>({id:uid(),name:n})),staff:[],recipes:[],meals:[],polls:[],requests:[],pantry:[],notes:[],pin:''});
const SB={url:'https://jltzmvbisdkmpajnqylp.supabase.co/rest/v1',key:'sb_publishable_horvo93FgGdq6miHahntGQ_mLk7SfNG'};
const COLS=['profiles','staff','recipes','meals','polls','requests','pantry','notes'];
const empty=()=>({profiles:[],staff:[],recipes:[],meals:[],polls:[],requests:[],pantry:[],notes:[],pin:'',ticks:{}});
// canonical JSON (sorted keys): Postgres jsonb reorders keys, so plain stringify would show false changes
const cj=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,i)=>(o[i]=x[i],o),{}):x);
let S=null,base={},me=null,admin=false,tab='home',sub=null,modalOpen=false,busy=false,synced=false,edited=false,fresh=true,KA=false,off=false,failT=null;
try{me=localStorage.getItem('ft_me')}catch(e){}
try{const l=localStorage.getItem('ft_state');if(l){S=Object.assign(empty(),JSON.parse(l));fresh=false}}catch(e){}
try{base=JSON.parse(localStorage.getItem('ft_base')||'{}')}catch(e){}
if(!S)S=Object.assign(empty(),seed());
// ---------- Supabase sync: local-first, per-record, retried until saved ----------
const saveLocal=()=>{try{localStorage.setItem('ft_state',JSON.stringify(S));localStorage.setItem('ft_base',JSON.stringify(base))}catch(e){}};
const setStat=t=>{const e=document.getElementById('sync');if(e)e.textContent=t};
async function rq(m,path,b,pf){const h={apikey:SB.key};if(b)h['Content-Type']='application/json';if(pf)h.Prefer=pf;
 const body=b?JSON.stringify(b):undefined,r=await fetch(SB.url+'/'+path,{method:m,headers:h,body,cache:'no-store',keepalive:KA&&(!body||body.length<60000)});
 if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,120));return m==='GET'?r.json():null}
function flat(){const m={};COLS.forEach(c=>(S[c]||[]).forEach(o=>m[c+'/'+o.id]=cj(o)));m['_pin/pin']=cj({v:S.pin||''});m['_ticks/ticks']=cj(S.ticks||{});return m}
function diff(){const c=flat(),up=[],del=[];for(const k in c)if(base[k]!==c[k])up.push(k);for(const k in base)if(!(k in c))del.push(k);return{c,up,del}}
const sp=k=>{const i=k.indexOf('/');return[k.slice(0,i),k.slice(i+1)]};
async function push(){if(busy||!(synced||!fresh))return;busy=true;clearTimeout(failT);
 try{for(;;){const{c,up,del}=diff();if(!up.length&&!del.length)break;setStat('Saving…');
   if(up.length)await rq('POST','ft_records?on_conflict=col,id',up.map(k=>{const[col,id]=sp(k);return{col,id,data:JSON.parse(c[k])}}),'resolution=merge-duplicates,return=minimal');
   const g={};del.forEach(k=>{const[col,id]=sp(k);(g[col]=g[col]||[]).push(id)});
   for(const col in g)await rq('DELETE','ft_records?col=eq.'+col+'&id=in.('+g[col].join(',')+')');
   up.forEach(k=>base[k]=c[k]);del.forEach(k=>delete base[k]);saveLocal()}
  off=false;setStat('')}
 catch(e){setStat('Not synced — saved on this device');if(!off){off=true;toast('Offline — will sync automatically')}failT=setTimeout(push,8000)}
 finally{busy=false}}
function persist(){edited=true;saveLocal();push()}
async function pull(){if(busy||modalOpen)return;
 try{const rows=await rq('GET','ft_records?select=col,id,data&order=seq.asc');
  if(busy||modalOpen)return;
  const d=diff();if((d.up.length||d.del.length)&&!(fresh&&!synced&&!edited))return; // unsynced local edits are pushed first, never overwritten
  const first=!synced;synced=true;
  if(!rows.length&&fresh&&first){push();return}
  const ns=empty(),nb={};
  rows.forEach(r=>{nb[r.col+'/'+r.id]=cj(r.data);if(r.col==='_pin')ns.pin=r.data.v||'';else if(r.col==='_ticks')ns.ticks=r.data;else if(ns[r.col])ns[r.col].push(r.data)});
  const before=cj(flat());S=ns;base=nb;fresh=false;saveLocal();
  if(before!==cj(flat()))render()
 }catch(e){}}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}
setInterval(()=>{if(!document.hidden)pull()},5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){KA=true;push();KA=false}else{push();pull()}});
addEventListener('online',()=>{push();pull()});
addEventListener('pagehide',()=>{KA=true;push()});
push();pull();
const P=id=>(S.profiles.find(p=>p.id===id)||{}).name||'—';
const myName=()=>P(me);
// ---------- forms ----------
function form(title,fields,vals,cb,del){modalOpen=true;vals=vals||{};
 const f=fields.map(x=>{const v=vals[x.k]??x.def??'';let i;
  if(x.t==='select')i=`<select name="${x.k}">${x.o.map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return`<option value="${esc(a)}" ${a==v?'selected':''}>${esc(b)}</option>`}).join('')}</select>`;
  else if(x.t==='area')i=`<textarea name="${x.k}" rows="${x.r||3}" placeholder="${esc(x.ph||'')}">${esc(v)}</textarea>`;
  else if(x.t==='opts'){const rq=S.requests.filter(r=>['Food & drinks','Snacks'].includes(r.cat)&&!['Declined','Completed'].includes(r.status)&&(!r.priv||admin||r.by===me));i=`<div class="ingsw"><div class="ings" data-k="${x.k}">${(v||[]).map(optRow).join('')}</div><button type="button" class="btn o s" data-a="addopt" style="margin-top:6px">+ Add option</button>${rq.length?`<div class="mut" style="margin:16px 0 4px">Add from requests</div>${rq.map(r=>`<button type="button" class="opt" data-a="addreq" data-t="${esc(r.desc.slice(0,60))}">+ ${esc(r.desc.slice(0,60))} <span class="mut">· ${esc(P(r.by))}</span></button>`).join('')}`:''}</div>`}
  else if(x.t==='ings')i=`<div class="ingsw"><datalist id="ingl">${knownNames().map(n=>`<option value="${esc(n)}">`).join('')}</datalist><div class="ings" data-k="${x.k}">${(v||[]).map(rowHtml).join('')}</div><button type="button" class="btn o s" data-a="addrow" style="margin-top:6px">+ Add ingredient</button></div>`;
  else if(x.t==='rcps')i=S.recipes.length?`<div class="ingsw"><div class="ings" data-k="${x.k}">${(v||[]).map(rcpRow).join('')}</div><button type="button" class="btn o s" data-a="addrcp" style="margin-top:6px">+ Add recipe</button></div>`:'<div class="mut">No recipes yet. Add some in More → Recipes first.</div>';
  else if(x.t==='checks')i=(x.o.length?x.o.map(([a,b])=>`<div class="chk"><input type="checkbox" name="${x.k}" value="${a}" ${(v||[]).includes(a)?'checked':''}>${esc(b)}</div>`).join(''):'<div class="mut">None available yet.</div>');

 $('#modal').innerHTML=`<div class="modal"><form class="sheet"><h2>${esc(title)}</h2>${f}<div class="row" style="margin-top:16px"><button type="button" class="btn o" data-a="x">Cancel</button>${del?'<button type="button" class="btn d" data-a="fdel">Delete</button>':''}<button type="button" class="btn" data-a="fsave">Save</button></div></form></div>`;
 const fm=$('#modal form');fm.onsubmit=e=>{e.preventDefault();window._fs()};window._fs=()=>{try{const bad=fields.find(x=>x.req&&!(fm.elements[x.k].value||'').trim());if(bad){toast(bad.l.replace(/ —.*/,'')+' is required');return}const o={};fields.forEach(x=>{if(x.t==='rcps')o[x.k]=[...new Set([...fm.querySelectorAll('.ings[data-k="'+x.k+'"] .rs')].map(i=>i.value).filter(Boolean))];else if(x.t==='opts')o[x.k]=[...fm.querySelectorAll('.ings[data-k="'+x.k+'"] .ot')].map(i=>i.value.trim()).filter(Boolean);else if(x.t==='ings')o[x.k]=[...fm.querySelectorAll('.ings[data-k="'+x.k+'"] .irow')].map(r=>({q:+r.querySelector('.iq').value||1,u:r.querySelector('.iu').value,n:r.querySelector('.in').value.trim(),d:r.querySelector('.id').value})).filter(i=>i.n);else if(x.t==='checks')o[x.k]=[...fm.querySelectorAll(`[name=${x.k}]:checked`)].map(i=>i.value);else o[x.k]=fm.elements[x.k].value.trim()});
  if(cb(o)!==false)closeM()}catch(err){toast('Could not save: '+((err&&err.message)||err))}};

function events(){const e=[];

// ---------- polls ----------
const eligible=p=>!p.eligible||p.eligible.includes(me);
const open=p=>!p.closed&&!(p.deadline&&new Date(p.deadline)<new Date());
function tally(p){const c={};p.options.forEach(o=>c[o.id]=0);Object.values(p.votes).forEach(v=>{if(c[v]!==undefined)c[v]++});return c}
function winner(p){const c=tally(p);let b=null;p.options.forEach(o=>{if(!b||c[o.id]>c[b.id])b=o});return b&&c[b.id]>0?b:null}
// ---------- shopping ----------
function parseIng(txt){return(txt||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{let d='Palengke';const m=l.match(/@\s*(.+)$/);if(m){l=l.replace(/@\s*(.+)$/,'').trim();d=DEST.find(x=>x.toLowerCase().startsWith(m[1].trim().toLowerCase()))||d}
 const t=l.split(/\s+/);let q=parseFloat(t[0]);if(isNaN(q)){q=1}else t.shift();let u='';if(t[1]&&UNITS.includes(t[0].toLowerCase())){u=t.shift().toLowerCase()}return{q,u,n:t.join(' '),d}})}
function shopList(){const need={};
 S.meals.filter(m=>m.date>=todayS()&&m.status!=='Served').forEach(m=>{const add=(i,s)=>{const k=i.n.toLowerCase()+'|'+i.u;if(!need[k])need[k]={...i,q:0};need[k].q+=i.q*s};mealRecipes(m).forEach(id=>{const r=S.recipes.find(x=>x.id===id);if(!r)return;getIngs(r).forEach(i=>add(i,1))})});
 S.pantry.forEach(p=>{const k=p.name.toLowerCase()+'|'+(p.unit||'').toLowerCase();if(need[k])need[k].q-=+p.qty||0});
 const g={};Object.entries(need).filter(([k,v])=>v.q>0.0001).forEach(([k,v])=>{(g[v.d]=g[v.d]||[]).push({k,...v})});return g}

 const low=S.pantry.filter(p=>p.min!==''&&+p.qty<=+p.min);

const rowHtml=i=>`<div class="irow ${i.n?'':'open'}"><div class="isum" data-a="editrow"><span class="isn">${esc(i.n||'')}</span><span class="mut isq">${esc(sumQty(i.q,i.u))}</span></div><div class="iedit"><input class="iq" type="number" step="any" min="0" placeholder="Qty" value="${esc(i.q??'')}"><select class="iu">${['',...UNITS].map(u=>`<option value="${u}" ${u===(i.u||'')?'selected':''}>${u||'unit'}</option>`).join('')}</select><input class="in" list="ingl" placeholder="Ingredient name" value="${esc(i.n||'')}"><select class="id">${DEST.map(d=>`<option ${d===i.d?'selected':''}>${d}</option>`).join('')}</select><div class="iact"><button type="button" class="btn o s" data-a="delrow">Remove</button><button type="button" class="btn s" data-a="donerow">Done</button></div></div></div>`;

V.vote=()=>{const mine=S.polls.map(p=>{const done=!open(p),show=!p.hide||done,c=tally(p),tot=Object.keys(p.votes).length,w=winner(p),el=eligible(p);

  ${p.options.map(o=>{const pc=tot?Math.round(c[o.id]/tot*100):0;return`<button class="opt ${p.votes[me]===o.id?'sel':''}" ${done||!el||!me?'disabled':''} data-a="cast" data-id="${p.id}" data-o="${o.id}"><div class="row"><span>${esc(o.t)}</span>${show?`<span class="mut">${c[o.id]} · ${pc}%</span>`:''}</div>${show?`<div class="bar"><i style="width:${pc}%"></i></div>`:''}</button>`}).join('')}

 prof(e){const p=S.profiles.find(x=>x.id===e.dataset.id);form(p?'Edit profile':'New profile',[{k:'name',l:'Name',req:1}],p,o=>{if(S.profiles.some(x=>x.id!==(p||{}).id&&x.name.toLowerCase()===o.name.toLowerCase())){toast('Name already exists');return false}if(p)p.name=o.name;else S.profiles.push({id:uid(),name:o.name});persist()},p&&(()=>{S.profiles=S.profiles.filter(x=>x!==p);S.meals.forEach(m=>m.cooks=m.cooks.filter(c=>c!==p.id));if(me===p.id)me=null;persist()}))},
 staff(e){const s=S.staff.find(x=>x.id===e.dataset.id);form(s?'Edit staff':'New staff',[{k:'name',l:'Name',req:1},{k:'role',l:'Position / responsibilities'}],s,o=>{if(s)Object.assign(s,o);else S.staff.push({id:uid(),...o});persist()},s&&(()=>{S.staff=S.staff.filter(x=>x!==s);S.meals.forEach(m=>m.cooks=m.cooks.filter(c=>c!==s.id));persist()}))},
 pantry(e){const p=S.pantry.find(x=>x.id===e.dataset.id);form(p?'Edit item':'New item',[{k:'name',l:'Item',req:1},{k:'qty',l:'Quantity',t:'number',req:1},{k:'unit',l:'Unit (g, kg, pcs…)'},{k:'cat',l:'Type',t:'select',o:['Food','Bathroom','Cleaning','Bedroom','Appliance','Other']},{k:'min',l:'Low-stock alert at or below',t:'number'},{k:'exp',l:'Expires',t:'date'}],p,o=>{if(p)Object.assign(p,o);else S.pantry.push({id:uid(),...o});persist()},p&&(()=>{S.pantry=S.pantry.filter(x=>x!==p);persist()}))},
 recipe(e){const r=S.recipes.find(x=>x.id===e.dataset.id);form(r?'Edit recipe':'New recipe',[{k:'name',l:'Name',req:1},{k:'cat',l:'Category',t:'select',o:CATS},{k:'il',l:'Ingredients',t:'ings'},{k:'steps',l:'Instructions',t:'area',r:5},{k:'diet',l:'Dietary info'}],r&&{...r,il:getIngs(r),cat:normCat(r.cat)},o=>{if(r)Object.assign(r,o);else S.recipes.push({id:uid(),...o});persist()},r&&(()=>{S.recipes=S.recipes.filter(x=>x!==r);S.meals.forEach(m=>{if(m.recipe===r.id)m.recipe='';if(m.recipes)m.recipes=m.recipes.filter(x=>x!==r.id)});persist()}))},
 meal(e){const m=S.meals.find(x=>x.id===(e.dataset||e).id);
  form(m?'Edit meal':'New meal',[{k:'name',l:'Meal name',req:1},{k:'date',l:'Date',t:'date',req:1,def:todayS()},{k:'time',l:'Meal',t:'select',o:MT,def:'Lunch'},{k:'cat',l:'Category',t:'select',o:CATS},{k:'recipes',l:'Recipes',t:'rcps'},{k:'cooks',l:'Who will cook? (family)',t:'checks',o:S.profiles.map(p=>[p.id,p.name])},{k:'overview',l:'Meal overview',t:'area',ph:'Highlights, flavors, what makes this meal special…'},{k:'notes',l:'Special instructions',t:'area'},{k:'status',l:'Status',t:'select',o:['Planned','Approved','Cooking','Served']}],m&&{...m,time:slot(m),cat:normCat(m.cat),recipes:mealRecipes(m)},o=>{if(m){Object.assign(m,o);m.recipe=''}else S.meals.push({id:uid(),...o});persist()},m&&(()=>{S.meals=S.meals.filter(x=>x!==m);persist()}))},
 poll(e){const p=S.polls.find(x=>x.id===(e.dataset||{}).id);
  form(p?'Edit poll':'New poll',[{k:'q',l:'Question',req:1},{k:'cat',l:'Type',t:'select',o:['Meal','Snack','Dessert','Beverage','Household decision']},{k:'opts',l:'Options (at least 2)',t:'opts'},{k:'for',l:'Poll is for (day)',t:'date',def:addDays(todayS(),1)},{k:'deadline',l:'Voting deadline',t:'datetime-local'},{k:'hide',l:'Hide results until closed',t:'select',o:[['0','No'],['1','Yes']]},{k:'elig',l:'Eligible voters (none ticked = everyone)',t:'checks',o:S.profiles.map(x=>[x.id,x.name])}],(p&&{q:p.q,cat:p.cat,opts:p.options.map(o=>o.t),deadline:p.deadline,for:p.for,hide:p.hide?'1':'0',elig:p.eligible||[]})||window._pre,o=>{const ls=[...new Set(o.opts)];if(ls.length<2){toast('Need 2+ distinct options');return false}
   const el=o.elig.length?o.elig:null;
   if(p){const old=p.options;p.options=ls.map(t=>old.find(x=>x.t===t)||{id:uid(),t});Object.keys(p.votes).forEach(k=>{if(!p.options.some(x=>x.id===p.votes[k])||(el&&!el.includes(k)))delete p.votes[k]});Object.assign(p,{q:o.q,cat:o.cat,for:o.for,deadline:o.deadline,hide:o.hide==='1',eligible:el})}
   else S.polls.push({id:uid(),q:o.q,cat:o.cat,for:o.for,options:ls.map(t=>({id:uid(),t})),votes:{},deadline:o.deadline,hide:o.hide==='1',eligible:el,closed:false});persist()},p&&(()=>{S.polls=S.polls.filter(x=>x!==p);persist()}))},
 newreq(){if(!me){toast('Pick your profile first');return}
  form('New meal request',[{k:'desc',l:'What meal would you like?',t:'area',req:1,ph:'e.g. Chicken adobo for dinner'},{k:'prio',l:'Priority',t:'select',o:['Low','Normal','High','Urgent'],def:'Normal'},{k:'due',l:'Needed by',t:'datetime-local'},{k:'priv',l:'Visibility',t:'select',o:[['0','Everyone'],['1','Private (me and admins)']]}],{},o=>{if(!o.desc){toast('Describe the meal');return false}S.requests.push({id:uid(),by:me,desc:o.desc,cat:'Food & drinks',prio:o.prio,due:o.due,priv:o.priv==='1',staff:'',status:'Pending'});persist()})},
 req(e){const r=S.requests.find(x=>x.id===e.dataset.id);if(!r)return;form('Manage request',[{k:'status',l:'Status',t:'select',o:['Pending','Approved','In Progress','Completed','Declined']},{k:'staff',l:'Assigned to',t:'select',o:[['','— nobody —'],...S.profiles.map(p=>[p.id,p.name])]}],r,o=>{Object.assign(r,o);persist()},()=>{S.requests=S.requests.filter(x=>x!==r);persist()})}
};
document.addEventListener('click',ev=>{const e=ev.target.closest('[data-a]');if(!e||e.disabled)return;if(e.type==='checkbox'){A.tick(e);return}ev.preventDefault&&e.tagName!=='INPUT'&&ev.preventDefault();const f=A[e.dataset.a];if(f)f(e)});
document.addEventListener('change',ev=>{const e=ev.target;if(e.dataset&&e.dataset.a==='tick')A.tick(e)});
render();
